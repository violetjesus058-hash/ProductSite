name = "productsite-api"
main = "src/index.ts"
compatibility_date = "2026-08-20"

# Deploy with: wrangler deploy
# Create the D1 database in the Cloudflare dashboard, then replace database_id below.
[[d1_databases]]
binding = "DB"
database_name = "productsite-db"
database_id = "af5d0b54-6dcc-4014-ac7c-2364ca32cb63"

[[kv_namespaces]]
binding = "OVERRIDES_CACHE"
id = "1bffec01fa2947ad96c3d708bd2c5451"

[[kv_namespaces]]
binding = "ANALYTICS_CACHE"
id = "41979ecf02604bd9aba0733ab35e3400"

[vars]
# Replace with the final Cloudflare Pages origin before deployment.
ALLOWED_ORIGIN = "https://productsite-8wf.pages.dev"

# Never commit ADMIN_API_KEY. Set it with:
# wrangler secret put ADMIN_API_KEY
